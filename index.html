<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>a color a day</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Atkinson Hyperlegible', sans-serif;
            transition: background-color 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            background-color: #372BAC;
            color: #FFFFFF;
        }
        .color-transition {
            transition: color 0.8s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.8s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-ui {
            border: 1px solid currentColor;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
        }
        .btn-ui:hover {
            background: rgba(255, 255, 255, 0.18);
        }
        .dark-mode .btn-ui {
            background: rgba(0, 0, 0, 0.06);
        }
        .dark-mode .btn-ui:hover {
            background: rgba(0, 0, 0, 0.12);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-6 md:p-12 select-none overflow-x-hidden">

    <!-- Header Navigation -->
    <header class="flex justify-between items-center w-full max-w-7xl mx-auto z-10 color-transition">
        <div class="flex items-center space-x-3">
            <h1 class="text-base font-bold tracking-wider uppercase">a color a day</h1>
        </div>
        
        <div class="flex items-center space-x-3">
            <button id="infoBtn" class="btn-ui color-transition px-4 py-2 rounded-lg text-sm font-medium flex items-center space-x-2 cursor-pointer">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span>About</span>
            </button>
            <button id="archiveBtn" class="btn-ui color-transition px-4 py-2 rounded-lg text-sm font-medium flex items-center space-x-2 cursor-pointer">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
                </svg>
                <span>Archive</span>
            </button>
        </div>
    </header>

    <!-- Main Content Display -->
    <main class="my-auto flex flex-col items-center justify-center text-center z-10 my-12">
        <p id="dayCounter" class="text-base font-medium tracking-widest opacity-80 mb-3 color-transition">
            Day 00002 / 16,777,216
        </p>

        <h2 id="colorName" class="text-4xl md:text-6xl font-bold tracking-tight mb-6 max-w-3xl leading-tight color-transition">
            Deep-sea purple
        </h2>

        <!-- Color Values with clean front icons -->

            <button id="copyHexBtn" class="font-mono btn-ui px-4 py-2 rounded-lg text-lg flex items-center space-x-2.5 transition hover:scale-105 cursor-pointer" title="Click to copy HEX">
                <svg class="w-4 h-4 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                </svg>
                <span id="hexValue">#372BAC</span>
            </button>
            <span class="hidden md:inline text-xs opacity-50">•</span>
