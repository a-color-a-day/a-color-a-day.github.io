<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>a color a day</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Atkinson Hyperlegible', sans-serif;
            transition: background-color 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .color-transition {
            transition: color 0.8s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.8s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-ui {
            border: 1px solid currentColor;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
        }
        .btn-ui:hover {
            background: rgba(255, 255, 255, 0.18);
        }
        .dark-mode .btn-ui {
            background: rgba(0, 0, 0, 0.06);
        }
        .dark-mode .btn-ui:hover {
            background: rgba(0, 0, 0, 0.12);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-6 md:p-12 select-none overflow-x-hidden">

    <!-- Header Navigation -->
    <header class="flex justify-between items-center w-full max-w-7xl mx-auto z-10 color-transition">
        <div class="flex items-center space-x-3">
            <h1 class="text-base font-bold tracking-wider uppercase">a color a day</h1>
        </div>
        
        <div class="flex items-center space-x-3">
            <button id="archiveBtn" class="btn-ui color-transition px-4 py-2 rounded-lg text-sm font-medium flex items-center space-x-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
                </svg>
                <span>Archive</span>
            </button>
        </div>
    </header>

    <!-- Main Content Display -->
    <main class="my-auto flex flex-col items-center justify-center text-center z-10 my-12">
        <!-- Day Counter (Level 3 - Small) -->
        <p id="dayCounter" class="text-base font-medium tracking-widest opacity-80 mb-3 color-transition">
            Day 00042 / 16,777,216
        </p>

        <!-- Color Name (Level 1 - Large / Title) -->
        <h2 id="colorName" class="text-4xl md:text-6xl font-bold tracking-tight mb-6 max-w-3xl leading-tight color-transition">
            Vivid Cerulean Blue
        </h2>

        <!-- Color Values (Level 2 - Standard) -->
        <div class="flex flex-col md:flex-row items-center justify-center space-y-2 md:space-y-0 md:space-x-6 text-xl md:text-2xl font-normal opacity-90 color-transition mb-8">
            <span id="hexValue" class="font-mono cursor-pointer hover:opacity-100" title="Click to copy HEX">#3A86EF</span>
            <span class="hidden md:inline text-xs opacity-50">•</span>
            <span id="rgbValue" class="font-mono cursor-pointer hover:opacity-100" title="Click to copy RGB">RGB (58, 134, 239)</span>
        </div>

        <!-- Action Controls -->
        <div class="flex items-center space-x-3">
            <button id="copyBtn" class="btn-ui color-transition px-5 py-2.5 rounded-lg text-sm font-medium flex items-center space-x-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                </svg>
                <span id="copyText">Copy Values</span>
            </button>
            <button id="randomBtn" class="btn-ui color-transition px-5 py-2.5 rounded-lg text-sm font-medium flex items-center space-x-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                <span>Explore Random</span>
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="flex flex-col md:flex-row justify-between items-center w-full max-w-7xl mx-auto z-10 text-xs opacity-75 space-y-2 md:space-y-0 color-transition">
        <p>A 45,000-year artwork celebrating infinity and patience.</p>
        <p id="dateDisplay">October 25, 2026</p>
    </footer>

    <!-- Archive Modal -->
    <div id="archiveModal" class="fixed inset-0 bg-black/60 backdrop-blur-md hidden z-50 flex items-center justify-center p-6">
        <div class="bg-neutral-900 text-white rounded-lg p-6 max-w-2xl w-full max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold">Past Colors Mosaic</h3>
                <button id="closeArchive" class="text-neutral-400 hover:text-white text-2xl font-bold">&times;</button>
            </div>
            <p class="text-sm text-neutral-400 mb-4">A growing mosaic of days passed.</p>
            <div id="mosaicGrid" class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-2 overflow-y-auto p-2 bg-neutral-950 rounded-lg flex-1 min-h-[200px]">
                <!-- Color tiles will be populated by JS -->
            </div>
        </div>
    </div>

    <script>
        const colorNames = [
            "Azure", "Cerulean", "Crimson", "Emerald", "Indigo", "Magenta", 
            "Ochre", "Saffron", "Scarlet", "Teal", "Vermilion", "Violet", 
            "Amber", "Celeste", "Coral", "Cyan", "Maroon", "Olive"
        ];
        const modifiers = [
            "Vivid", "Deep", "Muted", "Radiant", "Quiet", "Celestial", 
            "Ethereal", "Infinite", "Luminous", "Solitary", "Subtle", "Pure"
        ];

        let currentR = 58, currentG = 134, currentB = 239;
        let history = [];

        function getLuminance(r, g, b) {
            const a = [r, g, b].map(v => {
                v /= 255;
                return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
            });
            return a[0] * 0.2126 + a[1] * 0.7152 + a[2] * 0.0722;
        }

        function generateColorName(r, g, b) {
            const modIndex = (r + g) % modifiers.length;
            const nameIndex = (g + b) % colorNames.length;
            return `${modifiers[modIndex]} ${colorNames[nameIndex]}`;
        }

        function updateDisplay(r, g, b, isRandom = false) {
            currentR = r; currentG = g; currentB = b;
            const hex = "#" + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('').toUpperCase();
            const rgbStr = `RGB (${r}, ${g}, ${b})`;
            const name = generateColorName(r, g, b);

            document.body.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;

            const luminance = getLuminance(r, g, b);
            if (luminance > 0.45) {
                document.body.style.color = "#111827";
                document.body.classList.add("dark-mode");
            } else {
                document.body.style.color = "#FFFFFF";
                document.body.classList.remove("dark-mode");
            }

            document.getElementById('colorName').innerText = name;
            document.getElementById('hexValue').innerText = hex;
            document.getElementById('rgbValue').innerText = rgbStr;

            if (isRandom) {
                const randomDay = Math.floor(Math.random() * 1000) + 1;
                document.getElementById('dayCounter').innerText = `Day ${String(randomDay).padStart(5, '0')} / 16,777,216`;
            }

            if (!history.some(item => item.hex === hex)) {
                history.push({ r, g, b, hex, name });
                renderMosaic();
            }
        }

        function getRandomColor() {
            const r = Math.floor(Math.random() * 256);
            const g = Math.floor(Math.random() * 256);
            const b = Math.floor(Math.random() * 256);
            updateDisplay(r, g, b, true);
        }

        function copyToClipboard() {
            const hex = document.getElementById('hexValue').innerText;
            const rgb = document.getElementById('rgbValue').innerText;
            const textToCopy = `${hex} | ${rgb}`;
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                const copyText = document.getElementById('copyText');
                copyText.innerText = 'Copied!';
                setTimeout(() => copyText.innerText = 'Copy Values', 2000);
            });
        }

        function renderMosaic() {
            const grid = document.getElementById('mosaicGrid');
            grid.innerHTML = '';
            history.forEach((item) => {
                const tile = document.createElement('div');
                tile.className = 'aspect-square rounded-md cursor-pointer transition-transform hover:scale-105';
                tile.style.backgroundColor = item.hex;
                tile.title = `${item.name} (${item.hex})`;
                tile.onclick = () => {
                    updateDisplay(item.r, item.g, item.b);
                    document.getElementById('archiveModal').classList.add('hidden');
                };
                grid.appendChild(tile);
            });
        }

        document.getElementById('randomBtn').addEventListener('click', getRandomColor);
        document.getElementById('copyBtn').addEventListener('click', copyToClipboard);
        document.getElementById('archiveBtn').addEventListener('click', () => {
            document.getElementById('archiveModal').classList.remove('hidden');
        });
        document.getElementById('closeArchive').addEventListener('click', () => {
            document.getElementById('archiveModal').classList.add('hidden');
        });

        // Initialize with default color
        updateDisplay(58, 134, 239);
    </script>
</body>
</html>
